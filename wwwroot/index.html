<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Engineering Exam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <header class="hero">
            <h1>Engineering Interactive Exam</h1>
            <div class="hero-actions">
                <div class="theme-switch">
                    <button class="theme-btn" id="lightModeBtn" aria-label="Light mode" title="Light mode">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
                    </button>
                    <button class="theme-btn" id="darkModeBtn" aria-label="Dark mode" title="Dark mode">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                    </button>
                </div>
                <button class="btn btn-primary" id="newExamBtn">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
                    New exam
                </button>
            </div>
        </header>

        <details class="filter-panel" open>
            <summary>Filters</summary>
            <div class="filter-body">
                <div class="filter-row">
                    <div class="filter-title">Topic</div>
                    <div class="filter-buttons" id="categoryFilters"></div>
                </div>
                <div class="filter-row">
                    <div class="filter-title">Question type</div>
                    <div class="filter-buttons" id="typeFilters"></div>
                </div>
                <button class="btn btn-quiet" id="resetFiltersBtn">Clear filters</button>
            </div>
        </details>

        <div class="progress-section">
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <span class="progress-text" id="progressText">0 / 0</span>
        </div>

        <div id="loadStatus"></div>
        <div id="questionsArea" class="questions-area"></div>

        <div class="submit-exam-wrapper">
            <button class="btn-large" id="submitExamBtn">Submit exam</button>
        </div>

        <footer>
            Built by
            <a href="https://www.linkedin.com/in/ahmed-mohammed-ahmed-saber-abdelhamid-b46249324" target="_blank" rel="noopener noreferrer" class="footer-link">Ahmed Al-Sayad</a>
            &middot; 2026
        </footer>
    </div>

    <div id="resultModal" class="result-modal">
        <div class="result-card">
            <h2 class="result-title">Your score</h2>
            <div class="score-circle" id="scorePercent">0%</div>
            <p id="scoreMsg" class="score-msg"></p>
            <div id="mistakesList"></div>
            <div class="result-actions">
                <button class="btn btn-primary" id="closeResultBtn">Close</button>
                <button class="btn" id="newExamFromResultBtn">New exam</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
